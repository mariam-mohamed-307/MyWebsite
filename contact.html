<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact My Blog using the accessible contact form.">
    <title>My Blog | Contact</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-content">
            <a class="site-logo" href="index.html">My Blog</a>

            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-intro">
            <h1>Contact Us</h1>
            <p>Fill out the form below to get in touch with us.</p>
        </section>

        <section class="section">
            <div class="card">
                <form action="#" method="get">

                    <div class="form-group">
                        <label for="full-name">Full Name *</label>
                        <input
                            type="text"
                            id="full-name"
                            name="fullName"
                            autocomplete="name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            autocomplete="tel"
                            inputmode="tel"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="preferred-date">Preferred Date</label>
                        <input
                            type="date"
                            id="preferred-date"
                            name="preferredDate">
                    </div>

                    <div class="form-group">
                        <label for="topic">Topic</label>
                        <select id="topic" name="topic">
                            <option value="">Select a topic</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="general">General</option>
                        </select>
                    </div>

                    <fieldset>
                        <legend>Preferred Contact Method</legend>

                        <div class="choice-group">
                            <label class="choice" for="contact-email">
                                <input
                                    type="radio"
                                    id="contact-email"
                                    name="contactMethod"
                                    value="email"
                                    checked>
                                Email
                            </label>

                            <label class="choice" for="contact-phone">
                                <input
                                    type="radio"
                                    id="contact-phone"
                                    name="contactMethod"
                                    value="phone">
                                Phone
                            </label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Areas of Interest</legend>

                        <div class="choice-group">
                            <label class="choice" for="interest-html">
                                <input
                                    type="checkbox"
                                    id="interest-html"
                                    name="interests"
                                    value="html">
                                HTML
                            </label>

                            <label class="choice" for="interest-css">
                                <input
                                    type="checkbox"
                                    id="interest-css"
                                    name="interests"
                                    value="css">
                                CSS
                            </label>

                            <label class="choice" for="interest-web">
                                <input
                                    type="checkbox"
                                    id="interest-web"
                                    name="interests"
                                    value="web-development">
                                Web Development
                            </label>
                        </div>
                    </fieldset>

                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required></textarea>
                    </div>

                    <p class="help-text">Fields marked with * are required.</p>

                    <button type="submit">Send Message</button>
                    <button type="reset" class="btn-outline">Clear Form</button>

                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Blog. All rights reserved.</p>
    </footer>

</body>
</html>
